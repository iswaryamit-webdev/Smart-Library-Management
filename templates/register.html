<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>

    <style>

        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#121212;
            font-family:Arial, sans-serif;
        }

        .container{
            background:#1e1e1e;
            padding:35px;
            border-radius:15px;
            width:380px;
            text-align:center;
            box-shadow:0 0 20px rgba(255,255,255,0.1);
        }

        h1{
            color:#00e5ff;
            margin-bottom:25px;
        }

        label{
            display:block;
            text-align:left;
            color:white;
            margin-top:12px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            box-sizing:border-box;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:8px;
            background:#00e5ff;
            color:black;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#00bcd4;
        }

        a{
            display:block;
            margin-top:15px;
            color:#00e5ff;
            text-decoration:none;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📝 Student Registration</h1>

        <form method="POST">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Department</label>
            <input type="text" name="department" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Register</button>

        </form>

        <a href="/login">🔐 Already have an account?</a>

    </div>

</body>

</html>
