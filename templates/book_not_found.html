<!DOCTYPE html>
<html>

<head>
    <title>Book Not Found</title>

    <style>

        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#121212;
            font-family:Arial, sans-serif;
        }

        .container{
            background:#1e1e1e;
            padding:40px;
            border-radius:15px;
            text-align:center;
            width:400px;
            box-shadow:0 0 20px rgba(255,255,255,0.1);
        }

        h1{
            color:#ff5252;
        }

        p{
            color:white;
            margin:20px 0;
        }

        a{
            display:inline-block;
            padding:12px 20px;
            background:#00e5ff;
            color:black;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>❌ Book Not Found</h1>

        <p>
            The book you searched for does not exist in the library.
        </p>

        <a href="/search_book">🔍 Search Again</a>

    </div>

</body>

</html>
