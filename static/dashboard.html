<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>

    <style>

        body{
            margin:0;
            background:#121212;
            font-family:Arial, sans-serif;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            text-align:center;
            width:80%;
            max-width:900px;
        }

        h1{
            color:#00e5ff;
        }

        .title{
            font-size:40px;
            color:gold;
            margin-bottom:30px;
            font-weight:bold;
        }

        .cards{
            display:flex;
            justify-content:center;
            gap:20px;
            margin:30px 0;
            flex-wrap:wrap;
        }

        .card{
            background:#1e1e1e;
            padding:25px;
            border-radius:15px;
            width:220px;
            box-shadow:0 0 15px rgba(255,255,255,0.1);
        }

        .card h2{
            margin:0;
            color:#00e5ff;
        }

        .card p{
            font-size:30px;
            font-weight:bold;
            color:white;
        }

        .buttons{
            margin-top:30px;
        }

        .buttons a{
            display:inline-block;
            margin:10px;
            padding:12px 20px;
            background:#00e5ff;
            color:black;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .buttons a:hover{
            background:#00bcd4;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>👋 Welcome {{ name }} 🥰</h1>

        <div class="title">
            📚 Library Management System
        </div>

        <div class="cards">

            <div class="card">
                <h2>📚 Total Books</h2>
                <p>{{ Titles }}</p>
            </div>

            <div class="card">
                <h2>📦 Total Copies</h2>
                <p>{{ Copies }}</p>
            </div>

        </div>

        <div class="buttons">

            <a href="/add_book">➕ Add Book</a>

            <a href="/view_books">📖 View Books</a>

            <a href="/search_book">🔍 Search Book</a>

            <a href="/logout">🚪 Logout</a>

        </div>

    </div>

</body>

</html>
